services:
  - type: web
    name: uberhelper-web
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uberhelper-db
          property: connectionString

databases:
  - name: uberhelper-db
    plan: free
